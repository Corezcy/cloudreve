name: Build and release 4.18.0 zero-copy fork

on:
  push:
    branches:
      - feat/4.18.0-zero-copy-remote-download
    tags:
      - '4.18.0-zero-copy.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Corezcy/cloudreve'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Choose matching frontend and backend version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="4.18.0-zero-copy.1-dev.${GITHUB_SHA:0:7}"
          fi
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build frontend
        run: bash .build/build-assets.sh "$BUILD_VERSION"
      - name: Test changed packages
        run: go test -count=1 ./pkg/filemanager/driver/local ./pkg/filemanager/manager ./pkg/filemanager/workflows
      - name: Build executable
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion=$BUILD_VERSION -X github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit=${GITHUB_SHA:0:7}" \
            -o /tmp/cloudreve .
          test -s /tmp/cloudreve
      - name: Save frontend for release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: frontend-bundle
          path: application/statics/assets.zip
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.repository == 'Corezcy/cloudreve' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v7
        with:
          name: frontend-bundle
          path: application/statics
      - name: Publish GitHub prerelease
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --timeout 60m --config .goreleaser-fork.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
