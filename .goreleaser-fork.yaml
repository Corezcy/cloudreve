version: 2

# Publish archives to this fork only. The upstream config also pushes Docker
# images to cloudreve/cloudreve, which this fork must not publish.
builds:
  - env:
      - CGO_ENABLED=0
    binary: cloudreve
    ldflags:
      - -s -w
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion={{.Tag}}' -X 'github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit={{.ShortCommit}}'
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
      - loong64
    goarm:
      - 5
      - 6
      - 7
    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ['tar.gz']
    name_template: >-
      cloudreve_{{.Tag}}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: false
  prerelease: true
  target_commitish: '{{ .Commit }}'
  name_template: '{{ .Tag }}'
  header: |
    > 基于 [Cloudreve 4.18.0](https://github.com/cloudreve/cloudreve/releases/tag/4.18.0) 的非官方修改版：主节点的离线下载完成后，转入同一文件系统的本地存储时免拷贝移动；上传完成后才删除源文件。跨文件系统仍会拷贝，做种任务和其他存储路径保持原有行为。

    > Unofficial Cloudreve 4.18.0 build: completed master-node offline downloads targeting local storage are relocated without copying file contents on the same filesystem. The source is removed after upload completion. Cross-filesystem transfers still copy; seeding tasks and other storage paths retain the original behavior.
